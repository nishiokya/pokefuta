<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!--
    ポケふた/デザインマンホール共通のOGPカード。
    文字は sharp のテキストレイヤで後から重ねるので、ここには一切入れない
    （Linux の librsvg は Web フォントを解決できないため、SVG 側にフォント指定は置かない）。
    {{hero}} には写真か「写真なし」のプレート、{{rule}} には前置きの罫が入る。
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C241D"/>
      <stop offset="0.55" stop-color="#12382E"/>
      <stop offset="1" stop-color="#0A1C17"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.26" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#2F7D64" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2F7D64" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#F5EEDD" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="heroClip">
      <circle cx="318" cy="315" r="222"/>
    </clipPath>

    <filter id="heroShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 右端から見切れる大きなリム。蓋の縁を思わせる奥行きだけを足す -->
  <circle cx="1206" cy="316" r="322" fill="none" stroke="#F5EEDD" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle cx="1206" cy="316" r="268" fill="none" stroke="#F5EEDD" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- 版面の内枠 -->
  <rect x="28" y="28" width="1144" height="574" rx="18" fill="none" stroke="#F5EEDD" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- 主役の円。マンホールが円なので、角丸square ではなく円で抜く -->
  <g filter="url(#heroShadow)">
    <circle cx="318" cy="315" r="240" fill="#0A1C17" fill-opacity="0.55"/>
    <circle cx="318" cy="315" r="222" fill="#123A30"/>
  </g>
  <g clip-path="url(#heroClip)">
    {{hero}}
  </g>
  <circle cx="318" cy="315" r="222" fill="none" stroke="#0A1C17" stroke-opacity="0.55" stroke-width="7"/>
  <circle cx="318" cy="315" r="230" fill="none" stroke="#F5EEDD" stroke-opacity="0.26" stroke-width="1.5"/>
  <circle cx="318" cy="315" r="243" fill="none" stroke="#F5EEDD" stroke-opacity="0.11" stroke-width="1"/>

  <!-- 右カラムの罫 -->
  {{rule}}
  <rect x="600" y="498" width="528" height="1" fill="#F5EEDD" fill-opacity="0.16"/>
</svg>
